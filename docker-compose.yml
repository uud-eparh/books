services:
  postgres:
    image: postgres:16-alpine
    container_name: flibusta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flibusta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flibusta_secret}
      POSTGRES_DB: ${POSTGRES_DB:-flibusta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flibusta}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tor:
    build:
      context: .
      dockerfile: docker/Dockerfile.tor
    container_name: flibusta_tor
    restart: unless-stopped
    volumes:
      - ./docker/torrc:/etc/tor/torrc:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flibusta_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-flibusta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flibusta_secret}
      POSTGRES_DB: ${POSTGRES_DB:-flibusta}

      INPX_PATH: ${INPX_PATH:-/data/flibusta_fb2_local.inpx}
      TORRENT_DATA_PATH: ${TORRENT_DATA_PATH:-/data}
      TEMP_DOWNLOAD_PATH: ${TEMP_DOWNLOAD_PATH:-/app/tmp_downloads}
      TEMP_DOWNLOAD_MAX_GB: ${TEMP_DOWNLOAD_MAX_GB:-20}
      TEMP_FILE_TTL_MINUTES: ${TEMP_FILE_TTL_MINUTES:-10}

      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      APP_DEBUG: ${APP_DEBUG:-false}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_PROXY: socks5://tor:9050
    ports:
      - "8000:8000"
    volumes:
      - ${LIBRARY_PATH}:/data:ro
      - ./tmp_downloads:/app/tmp_downloads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: