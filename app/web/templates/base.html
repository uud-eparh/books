<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} — Библиотека FB2</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo">📚 Библиотека FB2</a>
            <form class="search-form" action="/search" method="get">
                {% set current_field = field|default(request.query_params.get('field', 'all')) %}
                <select name="field" class="search-field">
                    <option value="all" {% if current_field == 'all' %}selected{% endif %}>Везде</option>
                    <option value="title" {% if current_field == 'title' %}selected{% endif %}>Название</option>
                    <option value="author" {% if current_field == 'author' %}selected{% endif %}>Автор</option>
                    <option value="series" {% if current_field == 'series' %}selected{% endif %}>Серия</option>
                </select>
                <input
                    type="text"
                    name="q"
                    placeholder="Автор, название или серия…"
                    value="{{ q|default('') }}"
                    autofocus
                >
                <button type="submit">Найти</button>
            </form>
            <a href="/random" class="random-link" title="Случайная книга">🎲</a>
            <a href="#" class="cart-link" id="cart-link" title="Корзина">
    🛒 <span class="cart-badge" id="cart-badge" style="display:none">0</span>
</a>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Локальная библиотека FB2 · FastAPI + PostgreSQL</p>
        </div>
    </footer>


<!-- Модалка корзины -->
<div class="cart-modal" id="cart-modal" style="display:none">
    <div class="cart-modal-content">
        <div class="cart-modal-header">
            <h2>Корзина</h2>
            <button class="cart-modal-close" id="cart-modal-close">×</button>
        </div>
        <ul class="cart-modal-list" id="cart-modal-list">
            <li class="cart-empty">Загрузка…</li>
        </ul>
        <div class="cart-modal-actions">
            <button id="cart-modal-download" class="btn-primary">⬇ Скачать ZIP</button>
            <button id="cart-modal-clear" class="btn-secondary">Очистить</button>
        </div>
    </div>
</div>

<!-- Плавающая панель корзины -->
<div class="cart-panel" id="cart-panel" style="display:none">
    <span>🛒 <strong id="cart-panel-count">0</strong> книг</span>
    <button id="cart-download" class="btn-primary">Скачать ZIP</button>
    <button id="cart-clear" class="btn-secondary">Очистить</button>
</div>

<!-- Подключаем корзину -->
<script src="/static/cart.js"></script>
<script src="/static/cart-ui.js"></script>
</body>
</html>
